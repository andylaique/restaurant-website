<!DOCTYPE html>
<html>
<head>
    <title>Ankole Grill | Menu Selection</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="split-screen">

         <div class="top-right-socials">
            <a href="#"><img src="https://cdn.prod.website-files.com/65aa1f78e2380ad0548de50d/65cd3f93856a28e39b8d5525_icons-01-p-500.png"></a>
            <a href="#"><img src="https://cdn.prod.website-files.com/65aa1f78e2380ad0548de50d/65cd3f92f95774d081cd0d00_icons-02-p-500.png"></a>
        </div>
        
        <div id="sidebar" class="sidebar">
            <a href="story.html">Our Story</a>
            <a href="career.html">Careers</a>
            <a href="gallery.html">Gallery</a>
        </div>

        <div id="hours-popup" class="hours-box">
            <h3>Opening Hours</h3>
            <div class="branch-hours">
                <strong>Kitisuru</strong>
                <p>Mon - Sun</p>
                <p>9.00am - 11.00pm</p>
            </div>
            <div class="branch-hours">
                <strong>Kilimani</strong>
                <p>Mon - Sun</p>
                <p>7.30am - 11.00pm</p>
            </div>
        </div>
        

        <div class="left-side">
            <div class="content">
                <p class="sub-text">Karibu</p>
                <h2 class="branch-name">Kitisuru</h2>
                <a href="kitisuru.html" class="explore-link">explore our menu</a>
            </div>
        </div>

        <div class="right-side">
            <div class="content">
                <p class="sub-text">Discover</p>
                <h2 class="branch-name">Kilimani</h2>
                <a href="kilimani.html" class="explore-link">explore our menu</a>
            </div>
        </div>

           <div class="center-content">
            <img src="images/65c0b0524cdc940f7455af22_logo.svg" class="my-logo">
            
        </div>

        <nav class="bottom-bar">
            <a href="#" onclick="toggleMenu()">☰</a>
            <a href="#" onclick="toggleHours()">🕒</a>
            <div class="nav-divider"></div>
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reviews.html">Reviews</a>
            <a href="events.html">Events</a>
            <a href="Live.html">Live</a>
            <a href="contacts.html">Contacts</a>
            <a href="reservations.html" class="btn">Reservations</a>
        </nav>

        <a href="#" class="whatsapp-btn">
            <img src="images/whatsapp.svg">
        </a>
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("sidebar");
            document.getElementById("hours-popup").style.display = "none";
            menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        }

        function toggleHours() {
            var hours = document.getElementById("hours-popup");
            document.getElementById("sidebar").style.display = "none";
            hours.style.display = (hours.style.display === "block") ? "none" : "block";
        }
    </script>
</body>
</html>
